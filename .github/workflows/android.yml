# ==============================================================
# Android APK 编译工作流
# ==============================================================
# 方式一（推荐）：自托管 GitHub Actions Runner
#   在 yuyun 服务器上运行 setup-yuyun-runner.sh 注册为 runner，
#   每次 push 自动触发编译，APK 作为 artifact 可下载。
#
# 方式二：SSH 手动触发
#   运行 scripts/deploy.sh 自动执行 push → yuyun编译 → 取回 → 安装
# ==============================================================

name: Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:          # 手动触发

jobs:
  android:
    # ──────────────────────────────────────────────
    # 如果 yuyun 已注册为 self-hosted runner，改为:
    #   runs-on: [self-hosted, linux, android]
    # ──────────────────────────────────────────────
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ---- Rust ----
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      # ---- Java ----
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ---- Android SDK ----
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---- Node.js ----
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rili-tauri
            rili-core
            rili-cli

      - name: Install frontend
        run: pnpm install
        working-directory: frontend

      - name: TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Build frontend
        run: pnpm frontend:build

      # ---- Tauri CLI ----
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2"

      # ---- Android init（首次才需要，后续保留 gen/android 目录）----
      - name: Init Android (if needed)
        run: |
          if [ ! -d "rili-tauri/gen/android" ]; then
            cd rili-tauri && cargo tauri android init
          fi
        continue-on-error: true

      # ---- 构建 APK ----
      - name: Build Android APK
        run: |
          cd rili-tauri
          cargo tauri android build --apk

      # ---- 上传 artifact ----
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rili-android-apk
          path: rili-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: error
